<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture: three surfaces over Next.js server actions, a deterministic core, a provider chain for the model, and Supabase for Postgres, RLS and realtime broadcast.">
  <style>
    .head{fill:#171717;font-weight:700}
    .meta{fill:#7a7a7a;font-size:10.5px;letter-spacing:.06em}
    .body{fill:#4a4a4a;font-size:11.5px}
    .nodetx{fill:#171717;font-size:12.5px;font-weight:600}
    .box{fill:none;stroke:#b8b8b8;stroke-width:1.25}
    .band{fill:none;stroke:#d8d8d8;stroke-width:1;stroke-dasharray:3 3}
    .det{fill:none;stroke:#171717;stroke-width:1.75}
    .edge{stroke:#c2c2c2;stroke-width:1.5;fill:none}
    @media (prefers-color-scheme: dark){
      .head,.nodetx{fill:#f0ece4}.meta{fill:#8d8d8d}.body{fill:#b9b4aa}
      .box,.edge{stroke:#4a463f}.band{stroke:#39352f}.det{stroke:#f0ece4}
    }
  </style>

  <text class="head" x="0" y="16" font-size="15">How it is put together</text>
  <text class="meta" x="0" y="36">NO CLIENT DATA-FETCHING LIBRARY · NO STATE MANAGER · NO API ROUTES FOR MUTATIONS</text>

  <rect class="band" x="0" y="56" width="960" height="76" rx="3"/>
  <text class="meta" x="12" y="74">SURFACES</text>
  <rect class="box" x="150" y="80" width="180" height="40" rx="3"/>
  <text class="nodetx" x="162" y="98">Traveler</text><text class="meta" x="162" y="113">/TRIP/[ID] · /PLAN · /EXPLORE</text>
  <rect class="box" x="360" y="80" width="180" height="40" rx="3"/>
  <text class="nodetx" x="372" y="98">Operator</text><text class="meta" x="372" y="113">/OPS · /OPS/DISRUPTION/[ID]</text>
  <rect class="box" x="570" y="80" width="180" height="40" rx="3"/>
  <text class="nodetx" x="582" y="98">Coordinator</text><text class="meta" x="582" y="113">/FIELD/[ID] · PLAIN FORMS</text>

  <rect class="band" x="0" y="150" width="960" height="90" rx="3"/>
  <text class="meta" x="12" y="168">SERVER — NEXT.JS APP ROUTER, SERVER COMPONENTS + SERVER ACTIONS</text>
  <rect class="det" x="150" y="178" width="180" height="50" rx="3"/>
  <text class="nodetx" x="162" y="198">Deterministic core</text>
  <text class="body" x="162" y="216">engine · stage · compose · plan</text>
  <rect class="box" x="360" y="178" width="180" height="50" rx="3"/>
  <text class="nodetx" x="372" y="198">Agent runtime</text>
  <text class="body" x="372" y="216">tool loop · traced to agent_steps</text>
  <rect class="box" x="570" y="178" width="180" height="50" rx="3"/>
  <text class="nodetx" x="582" y="198">Auth guard</text>
  <text class="body" x="582" y="216">assertTripAccess on every write</text>

  <rect class="band" x="0" y="258" width="470" height="90" rx="3"/>
  <text class="meta" x="12" y="276">DATA — SUPABASE</text>
  <rect class="box" x="150" y="286" width="150" height="50" rx="3"/>
  <text class="nodetx" x="162" y="306">Postgres + RLS</text>
  <text class="body" x="162" y="324">blast_radius() lives here</text>
  <rect class="box" x="310" y="286" width="150" height="50" rx="3"/>
  <text class="nodetx" x="322" y="306">Realtime</text>
  <text class="body" x="322" y="324">broadcast — a nudge, no rows</text>

  <rect class="band" x="490" y="258" width="470" height="90" rx="3"/>
  <text class="meta" x="502" y="276">MODEL — A CHAIN, NOT A CLIENT</text>
  <rect class="box" x="570" y="286" width="120" height="50" rx="3"/>
  <text class="nodetx" x="582" y="306">Groq</text>
  <text class="body" x="582" y="324">primary</text>
  <rect class="box" x="700" y="286" width="120" height="50" rx="3"/>
  <text class="nodetx" x="712" y="306">Mistral</text>
  <text class="body" x="712" y="324">failover</text>
  <rect class="box" x="830" y="286" width="120" height="50" rx="3"/>
  <text class="nodetx" x="842" y="306">Gemini</text>
  <text class="body" x="842" y="324">failover</text>

  <path class="edge" d="M240 120 V178"/>
  <path class="edge" d="M450 120 V178"/>
  <path class="edge" d="M660 120 V178"/>
  <path class="edge" d="M240 228 V286"/>
  <path class="edge" d="M450 228 C 450 258, 610 258, 630 286"/>

  <text class="body" x="0" y="384" font-size="12.5">A broadcast carries no itinerary data — each client re-fetches through the server, where its own permissions still apply.</text>
</svg>
